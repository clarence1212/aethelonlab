function rnd(seed){ var s = seed; return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function pts(arr, color, size, op){

function wire(geo, color, op){ return new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: op })); }
var haloTex = (function(){
  var c = document.createElement('canvas'); c.width = c.height = 128;

/* ---------- world ---------- */
var grid;
(function(){

/* 0 · Opening: a breathing sphere of filaments */
(function(){

function icon(){ ppI.innerHTML = playing ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function toggle(){
  if (time >= T - 0.05) seek(0); playing = !playing; icon(); clearTimeout(endTimer); end.classList.remove('on');
  if (!playing){ if (cur) cur.pause(); } else if (cur && !cur.ended && shown >= 0){ var pr = cur.play(); if (pr && pr.catch) pr.catch(function(){}); }
}
function seek(t){ hush(); time = Math.max(0, Math.min(T, t)); snap = true; shown = -1; clearTimeout(endTimer); end.classList.remove('on'); }
pp.addEventListener('click', toggle);
var snd = document.getElementById('snd');
snd.addEventListener('click', function(){
  sound = !sound; snd.setAttribute('aria-pressed', sound);
  document.getElementById('sndT').textContent = sound ? 'Narration on' : 'Narration off';
  document.getElementById('sndW').setAttribute('opacity', sound ? '1' : '.25');
  if (sound){ seek(Math.min(N - 1, Math.floor(time / SEG)) * SEG + 0.01); playing = true; icon(); } else hush();
});
document.getElementById('again').addEventListener('click', function(){ seek(0); playing = true; icon(); });
document.addEventListener('keydown', function(e){
  if (e.target.closest && e.target.closest('button,a')) return;
  if (e.key === ' '){ e.preventDefault(); toggle(); }
  if (e.key === 'ArrowRight') seek((Math.floor(time / SEG) + 1) * SEG + 0.01);
  if (e.key === 'ArrowLeft') seek(Math.max(0, (Math.floor(time / SEG) - 1) * SEG + 0.01));
});
window.addEventListener('pointermove', function(e){ mx = e.clientX / window.innerWidth - 0.5; my = e.clientY / window.innerHeight - 0.5; });
window.__seek = function(t){ seek(t); playing = false; icon(); };
icon();

/* ---------- loop ---------- */
var wp = new THREE.Vector3(), pos = new THREE.Vector3(), tgt = new THREE.Vector3(), cPos = new THREE.Vector3(), cTgt = new THREE.Vector3(), snap = true, clock = new THREE.Clock(), wall = 0;
function frame(){
  var dt = Math.min(0.05, clock.getDelta()); wall += dt;
  if (playing){ time += dt; if (time >= T){ time = T; playing = false; icon(); cap.classList.add('out'); clearTimeout(endTimer); hush(); endTimer = setTimeout(function(){ end.classList.add('on'); say(6, 0); }, 1600); } }
  var ci = Math.min(N - 1, Math.floor(time / SEG)), p = Math.min(1, time / SEG - ci);
  setCap(ci);
  if (ci < N - 1 && p > 0.86 && shown === ci) cap.classList.add('out');
  for (var i = 0; i < N; i++){
    fills[i].style.width = (i < ci ? 100 : i === ci ? p * 100 : 0) + '%';
    var gt = time / SEG, gf = (i === 0 ? 1 : sm((gt - (i - 0.04)) / 0.16)) * (i === N - 1 ? 1 : 1 - sm((gt - (i + 1.0)) / 0.16));
    groups[i].visible = gf > 0.003;
    if (groups[i].visible){
      chapters[i](i < ci ? 1 : i === ci ? p : 0, wall);
      for (var m = 0; m < mats[i].length; m++){ var mt = mats[i][m]; mt.opacity = (mt.userData.dyn ? mt.opacity : mt.userData.base) * gf; }
    }
  }
  for (var k = 0; k < near.length; k++){
    var nn = near[k]; if (!nn.g.visible) continue;
    nn.o.getWorldPosition(wp); nn.o.material.opacity *= sm((wp.distanceTo(camera.position) - nn.r - 1.0) / 3.5);
  }
  camAt(time, pos, tgt);
  if (snap){ cPos.copy(pos); cTgt.copy(tgt); snap = false; } else { cPos.lerp(pos, 0.06); cTgt.lerp(tgt, 0.05); }
  camera.position.set(cPos.x + mx * 0.9 + Math.sin(wall * 0.23) * 0.5, cPos.y - my * 0.5 + Math.sin(wall * 0.17 + 1.3) * 0.24, cPos.z + Math.cos(wall * 0.19) * 0.4); camera.lookAt(cTgt);
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
